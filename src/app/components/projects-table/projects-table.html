<div class="card">
    <p class="list-title">Proyectos</p>
    <table class="table table-hover align-middle mb-0">
        <thead>
            <tr>
                <th>Proyecto</th>
                <th>Fecha inicio</th>
                <th>Fecha fin</th>
                <th>Presupuesto</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let p of proyectos()">
                <td>{{ p.proyecto }}</td>
                <td>{{ p.fechaInicio }}</td>
                <td>{{ p.fechaFin }}</td>
                <td>{{ p.presupuesto | number:'1.0-0' }}</td>
                <td>
                    <span class="badge rounded-pill" [class]="p.activo ? 'bg-primary' : 'bg-secondary'">
                        {{ p.activo ? 'Activo' : 'Inactivo' }}
                    </span>
                </td>
            </tr>
        </tbody>
    </table>
</div>
